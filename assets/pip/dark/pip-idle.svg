<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="259" viewBox="0 0 120 130" role="img" aria-label="Pip, Content"><style>
      .pip-ink{stroke:#1b1f2a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pip-thin{stroke-width:2}
      .pip-fill{fill:#d99b7f}.pip-leaf{fill:#c9cba3}.pip-eye,.pip-mouth{fill:#1b1f2a}.pip-cheek{fill:#a56f63;opacity:0.7}.pip-blush{opacity:.65}
      .pip-shine{fill:#fffaf1}.pip-page{fill:#fffaf1}.pip-heart{fill:#e26d5c;stroke:#1b1f2a;stroke-width:1.6}.pip-tongue{fill:#e9978a}
      .pip-tear,.pip-sweat{fill:#9ccbe0;stroke:#1b1f2a;stroke-width:1.2}.pip-dots circle{fill:rgba(240,217,196,.6)}.pip-starfill,.pip-spark{fill:#ffe1a8;stroke:#1b1f2a;stroke-width:1.2}
      .pip-zzz text{font-family:'Comic Sans MS',cursive;font-size:16px;fill:rgba(240,217,196,.6);font-weight:700}.pip-boil-b{opacity:0}
      .pip-body,.pip-sprout,.pip-wave{transform-box:fill-box;transform-origin:50% 100%}.pip-wave{transform-origin:0 100%}.pip-eyes{transform-box:fill-box;transform-origin:center}
      .pip-body{animation:b 4.2s ease-in-out infinite}.pip-eyes{animation:k 5.6s infinite}.pip-sprout{animation:s 3.6s ease-in-out infinite}.pip-wave{animation:w 2.4s ease-in-out infinite}
      .pip-boil-a{animation:ba .9s steps(1) infinite}.pip-boil-b{animation:bb .9s steps(1) infinite}
      @keyframes b{50%{transform:scale(1.012,1.03)}}@keyframes k{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
      @keyframes s{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes w{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-12deg)}}
      @keyframes ba{0%{opacity:1}50%{opacity:0}}@keyframes bb{0%{opacity:0}50%{opacity:1}}
    </style>
