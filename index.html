  <meta name="theme-color" content="#f5f4ed">
  <!-- Apply the saved theme before first paint so the wrong theme never flashes -->
  <script>
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('nook:settings') || '{}') || {}; } catch (e) {}
      var mode = s.theme || 'auto', h = new Date().getHours();
      var ds = typeof s.dayStart === 'number' ? s.dayStart : 7, ns = typeof s.nightStart === 'number' ? s.nightStart : 19;
      var t = mode === 'light' || mode === 'dark' ? mode : (h >= ds && h < ns ? 'light' : 'dark');
      var d = document.documentElement;
      d.setAttribute('data-theme', t);
      d.setAttribute('data-accent', s.accent || 'ember');
      var sysReduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var m = s.motion || 'system';
      d.setAttribute('data-motion', m === 'reduce' || (m === 'system' && sysReduce) ? 'reduce' : (s.anim || 'full'));
      d.style.setProperty('--text-scale', ((s.textScale || 100) / 100).toString());
    })();
  </script>
